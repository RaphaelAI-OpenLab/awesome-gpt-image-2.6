name: Sync Directus materials

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directus-materials-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pending materials and images from Directus
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL || vars.CMS_BASE_URL }}
          DIRECTUS_API_TOKEN: ${{ secrets.DIRECTUS_API_TOKEN }}
          SYNC_TARGET_BRANCH: main
        run: python3 scripts/sync_directus_materials.py fetch --state-file /tmp/directus-sync-state.json
      - name: Commit and push synced assets and index
        run: |
          if [ -d assets/cms-materials ]; then
            git add -- assets/cms-materials
          fi
          git add -- content/cms-materials.json
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(cms): sync Directus prompt materials and images'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
      - name: Write back GitHub image URLs to Directus
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL || vars.CMS_BASE_URL }}
          DIRECTUS_API_TOKEN: ${{ secrets.DIRECTUS_API_TOKEN }}
        run: python3 scripts/sync_directus_materials.py writeback --state-file /tmp/directus-sync-state.json
