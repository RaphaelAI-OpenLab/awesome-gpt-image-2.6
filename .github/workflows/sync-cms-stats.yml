name: Sync CMS materials & stats

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      force_timestamp:
        description: 'Force refresh synced_at even when CMS items are unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cms-readme-stats
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Directus CMS materials into content/cms-materials.json
        env:
          CMS_BASE_URL: ${{ vars.CMS_BASE_URL }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: |
          if [ "${{ inputs.force_timestamp }}" = "true" ]; then
            python3 scripts/sync_cms_materials.py --force-timestamp
          else
            python3 scripts/sync_cms_materials.py
          fi
      - name: Rebuild READMEs and CMS case pages
        run: python3 scripts/build_readme.py
      - name: Validate repository, R2 URL allowlist, and generated pages
        run: |
          python3 scripts/validate.py
          python3 scripts/build_readme.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit synced materials and READMEs
        run: |
          git add -- content/cms-materials.json README.md README.*.md cases/
          if git diff --cached --quiet; then
            echo "No CMS material changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(cms): sync Directus materials and rebuild README'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
