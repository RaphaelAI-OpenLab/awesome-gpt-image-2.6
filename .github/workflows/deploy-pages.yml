name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'site.config.json'
      - 'content/source-cases.json'
      - 'content/prompts.json'
      - 'content/cms-materials.json'
      - 'scripts/cms_materials.py'
      - 'scripts/build_pages.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Sync CMS materials & stats']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prompt and API cheat sheet
        run: python3 scripts/build_pages.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
